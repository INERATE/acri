name: publish

# Triggered only by publishing a GitHub Release -- pushing a tag alone does
# NOT run this. A release is a separate, deliberate action so there's always
# a human decision point between "tag exists" and registries get new versions.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-pypi:
    name: Publish Python (PyPI)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing -- no stored token/secret
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    name: Publish Rust (crates.io)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # rust/ and typescript/ version independently of the Python release that
      # actually triggers this workflow -- every GitHub Release re-publishes
      # both unconditionally, and crates.io/npm both reject re-publishing an
      # unchanged version. Skip rather than fail loudly on every Python-only release.
      - name: Skip if this version is already published
        id: check
        working-directory: rust
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if curl -sf -H "User-Agent: acri-ci-workflow" "https://crates.io/api/v1/crates/acri-core/$version" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to crates.io
        if: steps.check.outputs.skip == 'false'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish

  publish-npm:
    name: Publish TypeScript (npm)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Skip if this version is already published
        id: check
        working-directory: typescript
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "acri-core@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install, Build & Publish to npm
        if: steps.check.outputs.skip == 'false'
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci || npm install
          npm run build
          npm publish --access public --provenance
