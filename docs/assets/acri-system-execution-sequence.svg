<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%"
  style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',Helvetica,sans-serif">
  <defs>
    <filter id="ss" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="ssA" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="9" flood-color="#2563eb" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hdrG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrP" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0,7 3.5,0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrG2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="#059669"/>
    </marker>
    <marker id="arrA" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="#d97706"/>
    </marker>
    <marker id="arrAR" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0,7 3.5,0 7" fill="#d97706"/>
    </marker>
  </defs>
  <style>
    .pulse { stroke-dasharray:6,6; animation:pd 1.8s linear infinite; }
    @keyframes pd { to{ stroke-dashoffset:-12; } }
    .lbl { font-size:10px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; }
    .mono { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
    .tStep { font-size:12px; font-weight:700; fill:#0f172a; }
    .tCode { font-size:10px; fill:#64748b; }
    .tActor { font-size:12px; font-weight:700; fill:#0f172a; text-anchor:middle; }
    .tSub { font-size:10px; fill:#94a3b8; text-anchor:middle; }
    .lifeline { stroke:#e2e8f0; stroke-dasharray:4,4; stroke-width:1.5; }
  </style>

  <!-- White background + top accent -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect width="1200" height="3" fill="url(#blueG)" rx="2"/>

  <!-- Window -->
  <rect x="24" y="12" width="1152" height="776" rx="14" fill="#ffffff" filter="url(#ss)"/>
  <rect x="24" y="12" width="1152" height="44" rx="14" fill="url(#hdrG)"/>
  <rect x="24" y="40" width="1152" height="16" fill="url(#hdrG)"/>
  <line x1="24" y1="56" x2="1176" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="70" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="90" cy="34" r="6" fill="#27c93f"/>
  <text x="116" y="39" fill="#0f172a" font-size="14" font-weight="700">ACRI Execution Lifecycle &amp; Latency Sequence</text>
  <rect x="1028" y="22" width="120" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1088" y="37" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="700" class="mono">0.038ms resolve</text>

  <!-- ═══ 5 ACTOR LANES ════════════════════════ -->
  <!-- Widths: User@80, Resolver@330, LLM@580, Sandbox@830, Press@1080 -->

  <!-- Actor 1: User Client -->
  <g transform="translate(44,70)">
    <rect width="136" height="48" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ssA)"/>
    <rect x="0" y="0" width="136" height="3" rx="2" fill="url(#blueG)"/>
    <text x="68" y="26" class="tActor">User Client</text>
    <text x="68" y="40" class="tSub">Web Chat · Copilot</text>
    <line x1="68" y1="48" x2="68" y2="680" class="lifeline"/>
  </g>
  <!-- Actor 2: ACRI Resolver -->
  <g transform="translate(270,70)">
    <rect width="150" height="48" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#ssA)"/>
    <rect x="0" y="0" width="150" height="3" rx="2" fill="url(#blueG)"/>
    <text x="75" y="22" class="tActor" fill="#2563eb">ACRI Resolver</text>
    <text x="75" y="36" class="tSub">compass.resolve()</text>
    <line x1="75" y1="48" x2="75" y2="680" class="lifeline"/>
  </g>
  <!-- Actor 3: Foundation LLM -->
  <g transform="translate(504,70)">
    <rect width="150" height="48" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#ss)"/>
    <rect x="0" y="0" width="150" height="3" rx="2" fill="url(#purpleG)"/>
    <text x="75" y="26" class="tActor">Foundation LLM</text>
    <text x="75" y="40" class="tSub">Gemini 2.5 · Claude</text>
    <line x1="75" y1="48" x2="75" y2="680" class="lifeline"/>
  </g>
  <!-- Actor 4: Tool Sandbox -->
  <g transform="translate(740,70)">
    <rect width="140" height="48" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ss)"/>
    <rect x="0" y="0" width="140" height="3" rx="2" fill="url(#greenG)"/>
    <text x="70" y="26" class="tActor">Tool Sandbox</text>
    <text x="70" y="40" class="tSub">GitHub · Filesystem</text>
    <line x1="70" y1="48" x2="70" y2="680" class="lifeline"/>
  </g>
  <!-- Actor 5: Press & Ledger -->
  <g transform="translate(956,70)">
    <rect width="148" height="48" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#ss)"/>
    <rect x="0" y="0" width="148" height="3" rx="2" fill="url(#amberG)"/>
    <text x="74" y="26" class="tActor">Press &amp; Ledger</text>
    <text x="74" y="40" class="tSub">Compactor · OTel</text>
    <line x1="74" y1="48" x2="74" y2="680" class="lifeline"/>
  </g>

  <!-- ═══ SEQUENCE STEPS ════════════════════════ -->

  <!-- Step 1: T=0ms User → Resolver -->
  <g transform="translate(0,158)">
    <rect x="28" y="-14" width="72" height="20" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="36" y="-1" fill="#2563eb" font-size="10" font-weight="700" class="mono">T = 0.00 ms</text>
    <line x1="112" y1="0" x2="338" y2="0" stroke="#2563eb" stroke-width="2" class="pulse" marker-end="url(#arrB)"/>
    <text x="145" y="-8" class="tStep">1. Inbound User Prompt</text>
    <text x="145" y="14" class="tCode">"Merge PR #42 &amp; dispatch Zendesk confirmation"</text>
  </g>

  <!-- Step 2: T=0.04ms BM25 self-call (Resolver loop) -->
  <g transform="translate(0,228)">
    <rect x="28" y="-14" width="72" height="20" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="36" y="-1" fill="#2563eb" font-size="10" font-weight="700" class="mono">T = 0.04 ms</text>
    <path d="M 345,0 C 390,0 390,28 345,28" fill="none" stroke="#2563eb" stroke-width="2" class="pulse" marker-end="url(#arrB)"/>
    <text x="400" y="8" class="tStep" fill="#2563eb">2. compass.resolve(query)</text>
    <text x="400" y="24" class="tCode">BM25 isolates top 3 of 500 tools · 38 µs</text>
  </g>

  <!-- Step 3: T=0.10ms Resolver → LLM -->
  <g transform="translate(0,300)">
    <rect x="28" y="-14" width="72" height="20" rx="6" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="36" y="-1" fill="#7c3aed" font-size="10" font-weight="700" class="mono">T = 0.10 ms</text>
    <line x1="345" y1="0" x2="575" y2="0" stroke="#7c3aed" stroke-width="2" class="pulse" marker-end="url(#arrP)"/>
    <text x="370" y="-8" class="tStep">3. Filtered Schema Payload</text>
    <text x="370" y="14" class="tCode">Prompt + 3 schemas · 95% bloat cut · KV-cache safe</text>
  </g>

  <!-- Step 4: T=480ms LLM → Sandbox -->
  <g transform="translate(0,380)">
    <rect x="28" y="-14" width="72" height="20" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="36" y="-1" fill="#059669" font-size="10" font-weight="700" class="mono">T = 480 ms</text>
    <line x1="579" y1="0" x2="808" y2="0" stroke="#059669" stroke-width="2" class="pulse" marker-end="url(#arrG2)"/>
    <text x="610" y="-8" class="tStep">4. Structured Function Call</text>
    <text x="610" y="14" class="tCode">github.merge_pr(id=42) · Accuracy 56% 🏆 · 2.5× naive</text>
  </g>

  <!-- Step 5: T=780ms Sandbox → Press -->
  <g transform="translate(0,458)">
    <rect x="28" y="-14" width="72" height="20" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="36" y="-1" fill="#d97706" font-size="10" font-weight="700" class="mono">T = 780 ms</text>
    <line x1="810" y1="0" x2="1024" y2="0" stroke="#d97706" stroke-width="2" class="pulse" marker-end="url(#arrA)"/>
    <text x="838" y="-8" class="tStep">5. Raw Tool Output → Press</text>
    <text x="838" y="14" class="tCode">12 KB JSON response payload</text>
  </g>

  <!-- Step 6: T=810ms Press → LLM (compacted return) -->
  <g transform="translate(0,530)">
    <rect x="28" y="-14" width="72" height="20" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="36" y="-1" fill="#d97706" font-size="10" font-weight="700" class="mono">T = 810 ms</text>
    <line x1="1022" y1="0" x2="581" y2="0" stroke="#d97706" stroke-width="2" class="pulse" marker-end="url(#arrAR)"/>
    <text x="720" y="-8" class="tStep">6. Compacted Snapshot</text>
    <text x="720" y="14" class="tCode">acri.press: 12 KB → 180 B · OTel span emitted</text>
  </g>

  <!-- Step 7: T=1650ms LLM → User (stream + artifact) -->
  <g transform="translate(0,610)">
    <rect x="28" y="-14" width="72" height="20" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="36" y="-1" fill="#2563eb" font-size="10" font-weight="700" class="mono">T = 1650 ms</text>
    <line x1="579" y1="0" x2="114" y2="0" stroke="#2563eb" stroke-width="2.5" class="pulse" marker-end="url(#arrB)"/>
    <text x="165" y="-10" class="tStep" fill="#2563eb">7. Stream + Interactive UI Artifact</text>
    <text x="165" y="14" class="tCode">Zendesk form card mounted in chat with live Send button</text>
  </g>

  <!-- ═══ FOOTER RECEIPT ════════════════════════ -->
  <rect x="24" y="744" width="1152" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="44" cy="762" r="4" fill="#059669"/>
  <text x="58" y="767" fill="#64748b" font-size="11">
    <tspan fill="#0f172a" font-weight="700">Verified Receipt:</tspan>
    <tspan>  Resolution </tspan><tspan fill="#2563eb" font-weight="700">0.038 ms</tspan>
    <tspan>  ·  Accuracy </tspan><tspan fill="#059669" font-weight="700">56% (2.5× naive)</tspan>
    <tspan>  ·  Context reduction </tspan><tspan fill="#7c3aed" font-weight="700">−95%</tspan>
    <tspan>  ·  E2E turn </tspan><tspan fill="#0f172a" font-weight="600">1.65 s</tspan>
    <tspan>  ·  Cost </tspan><tspan fill="#d97706" font-weight="700">$0.00032</tspan>
  </text>
</svg>
