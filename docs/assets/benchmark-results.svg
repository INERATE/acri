<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="340" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="700" fill="#0f172a">acri — measured, not projected</text>
  <text x="20" y="50" font-size="12" fill="#64748b">100-tool synthetic corpus, 50 hand-written queries, gemini-2.5-flash. Single run — see README.md.</text>

  <!-- baseline -->
  <line x1="60" y1="250" x2="920" y2="250" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel 1: recall@k -->
  <text x="60" y="80" font-size="13" font-weight="700" fill="#0f172a">recall@k — assay/recall.py</text>

  <g>
    <rect x="60" y="139" width="50" height="111" fill="#93c5fd"/>
    <text x="85" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">74%</text>
    <text x="85" y="268" text-anchor="middle" font-size="11" fill="#475569">k=1</text>
  </g>
  <g>
    <rect x="130" y="115" width="50" height="135" fill="#60a5fa"/>
    <text x="155" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">90%</text>
    <text x="155" y="268" text-anchor="middle" font-size="11" fill="#475569">k=3</text>
  </g>
  <g>
    <rect x="200" y="100" width="50" height="150" fill="#3b82f6"/>
    <text x="225" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">100%</text>
    <text x="225" y="268" text-anchor="middle" font-size="11" fill="#475569">k=5</text>
  </g>
  <g>
    <rect x="270" y="100" width="50" height="150" fill="#3b82f6"/>
    <text x="295" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">100%</text>
    <text x="295" y="268" text-anchor="middle" font-size="11" fill="#475569">k=10</text>
  </g>

  <line x1="360" y1="70" x2="360" y2="250" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Panel 2: accuracy -->
  <text x="400" y="80" font-size="13" font-weight="700" fill="#0f172a">tool-selection accuracy — assay/accuracy.py</text>

  <g>
    <rect x="420" y="124" width="80" height="126" fill="#fca5a5"/>
    <text x="460" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">84%</text>
    <text x="460" y="268" text-anchor="middle" font-size="11" fill="#475569">naive, 100 tools</text>
  </g>
  <g>
    <rect x="540" y="112" width="80" height="138" fill="#86efac"/>
    <text x="580" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">92%</text>
    <text x="580" y="268" text-anchor="middle" font-size="11" fill="#475569">acri, top 5</text>
  </g>

  <text x="700" y="140" font-size="11" fill="#64748b" width="220">
    <tspan x="700" dy="0">8-point gap. For scale, this</tspan>
    <tspan x="700" dy="15">benchmark's own run-to-run</tspan>
    <tspan x="700" dy="15">noise is ~2 points — see the</tspan>
    <tspan x="700" dy="15">run history in decisions.md.</tspan>
  </text>

  <text x="20" y="300" font-size="12" fill="#475569">This is the third published number for accuracy. The first two were corrected in public after finding real benchmark bugs —</text>
  <text x="20" y="318" font-size="12" fill="#475569">see "Corrected twice, both times in public" in README.md before treating this as final.</text>
</svg>
