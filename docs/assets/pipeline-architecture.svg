<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%"
  style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',Helvetica,sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="sA" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#cbd5e1"/>
    </marker>
    <marker id="arrB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .flow { stroke-dasharray:5,5; animation:flowAnim 1.8s linear infinite; }
    @keyframes flowAnim { to { stroke-dashoffset:-10; } }
    .lbl { font-size:10px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; }
    .mono { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
    .t1 { font-size:14px; font-weight:700; fill:#0f172a; }
    .t2 { font-size:11px; fill:#64748b; }
    .t3 { font-size:11px; fill:#475569; }
  </style>

  <!-- Background -->
  <rect width="1100" height="560" fill="#ffffff"/>
  <!-- Top border accent -->
  <rect width="1100" height="3" fill="url(#blueG)" rx="2"/>

  <!-- Header -->
  <g transform="translate(48,28)">
    <text fill="#0f172a" font-size="20" font-weight="800" letter-spacing="-0.5px">ACRI Resolution &amp; Execution Pipeline</text>
    <text y="22" fill="#94a3b8" font-size="13">Decoupled in-process capability routing for large MCP toolsets · Verified empirically on gemini-2.5-flash</text>
  </g>

  <!-- ═══ FLOW CONNECTORS ═══════════════════════════════════ -->
  <!-- 1→2 -->
  <line x1="208" y1="270" x2="276" y2="270" stroke="#2563eb" stroke-width="1.5" class="flow" marker-end="url(#arrB)"/>
  <!-- 2→3 -->
  <line x1="522" y1="270" x2="590" y2="270" stroke="#2563eb" stroke-width="1.5" class="flow" marker-end="url(#arrB)"/>
  <!-- 3→4 -->
  <line x1="716" y1="270" x2="762" y2="270" stroke="#94a3b8" stroke-width="1.5" class="flow" marker-end="url(#arr)"/>
  <!-- 4 down to execution row -->
  <line x1="883" y1="380" x2="883" y2="426" stroke="#059669" stroke-width="1.5" class="flow"/>
  <line x1="883" y1="440" x2="740" y2="440" stroke="#059669" stroke-width="1.5" class="flow" marker-end="url(#arrG)"/>
  <!-- sandbox→press -->
  <line x1="490" y1="455" x2="396" y2="455" stroke="#94a3b8" stroke-width="1.5" class="flow" marker-end="url(#arr)"/>

  <!-- ═══ CARD 1: USER PROMPT ══════════════════════════════ -->
  <g transform="translate(48,160)">
    <rect width="160" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
    <rect x="0" y="0" width="160" height="3" rx="2" fill="#94a3b8"/>
    <g transform="translate(14,16)">
      <text class="lbl" fill="#94a3b8">Input</text>
      <text y="26" class="t1" font-size="13">User Prompt</text>
      <text y="42" class="t2">Natural language</text>
      <rect y="58" width="132" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="78" class="mono" font-size="10" fill="#475569">"Merge PR #42</text>
      <text x="10" y="94" class="mono" font-size="10" fill="#475569">and notify</text>
      <text x="10" y="110" class="mono" font-size="10" fill="#475569">Zendesk support"</text>
      <text y="160" class="t2">Tokens: 14</text>
      <text y="176" class="t2">Corpus: 500+ tools</text>
    </g>
  </g>

  <!-- ═══ CARD 2: ACRI COMPASS ════════════════════════════ -->
  <g transform="translate(276,130)">
    <rect width="246" height="280" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#sA)"/>
    <rect x="0" y="0" width="246" height="3" rx="2" fill="url(#blueG)"/>
    <g transform="translate(16,16)">
      <text class="lbl" fill="#2563eb">ACRI Core</text>
      <text x="170" y="2" text-anchor="end" fill="#059669" font-size="11" font-weight="700" class="mono">⚡ 38 µs</text>
      <text y="26" fill="#0f172a" font-size="16" font-weight="800">compass.resolve()</text>
      <text y="42" class="t2">BM25 Hybrid Tool Indexer</text>

      <!-- Corpus box -->
      <rect y="56" width="214" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="74" fill="#94a3b8" class="lbl">Indexed Corpus (500+ Tools)</text>
      <text x="10" y="93" class="t3">✓  GitHub · Postgres · Jira</text>
      <text x="10" y="111" class="t3">✓  Zendesk · Filesystem MCP</text>

      <!-- Matched results -->
      <rect y="144" width="214" height="100" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="162" fill="#2563eb" class="lbl">Matched Schemas (k=3)</text>
      <text x="10" y="182" fill="#0f172a" font-size="12" class="mono">1. github.merge_pr   0.98</text>
      <text x="10" y="200" class="mono" font-size="11" fill="#64748b">2. zendesk.reply     0.91</text>
      <text x="10" y="218" class="mono" font-size="11" fill="#64748b">3. ledger.log        0.85</text>

      <text y="258" class="t2">−95% context bloat · KV-cache safe</text>
    </g>
  </g>

  <!-- ═══ CARD 3: FILTERED SCHEMAS ════════════════════════ -->
  <g transform="translate(590,190)">
    <rect width="126" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
    <rect x="0" y="0" width="126" height="3" rx="2" fill="#7c3aed"/>
    <g transform="translate(14,16)">
      <text class="lbl" fill="#7c3aed">Optimized</text>
      <text y="26" class="t1" font-size="12">Top 3 Schemas</text>
      <text y="42" class="t2">Injected to LLM</text>

      <circle cx="49" cy="94" r="34" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="49" y="88" text-anchor="middle" fill="#6d28d9" font-size="15" font-weight="800">−95%</text>
      <text x="49" y="104" text-anchor="middle" fill="#94a3b8" font-size="9">bloat cut</text>
    </g>
  </g>

  <!-- ═══ CARD 4: FOUNDATION MODEL ════════════════════════ -->
  <g transform="translate(762,140)">
    <rect width="242" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
    <rect x="0" y="0" width="242" height="3" rx="2" fill="#7c3aed"/>
    <g transform="translate(16,16)">
      <text class="lbl" fill="#7c3aed">Foundation LLM</text>
      <text y="26" fill="#0f172a" font-size="14" font-weight="700">Gemini 2.5 · Claude</text>
      <text y="42" class="t2">Native structured tool calling</text>

      <!-- Accuracy box -->
      <rect y="56" width="210" height="64" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="80" fill="#059669" font-size="18" font-weight="800">Accuracy: 56% 🏆</text>
      <text x="10" y="98" fill="#64748b" font-size="11">vs 20% naive  ·  2.5× gain</text>

      <!-- Function call -->
      <rect y="132" width="210" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="152" fill="#94a3b8" class="lbl">Function Call</text>
      <text x="10" y="172" fill="#0f172a" font-size="12" class="mono">github.merge_pr(42)</text>
    </g>
  </g>

  <!-- ═══ EXECUTION ROW ════════════════════════════════════ -->
  <!-- Sandbox card -->
  <g transform="translate(490,416)">
    <rect width="250" height="96" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#s)"/>
    <rect x="0" y="0" width="250" height="3" rx="2" fill="url(#greenG)"/>
    <g transform="translate(14,14)">
      <text class="lbl" fill="#059669">MCP Sandbox</text>
      <text y="20" class="t1" font-size="12">Tool Execution</text>
      <text y="36" class="t2">Isolated stdio container</text>
      <rect y="46" width="222" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="62" fill="#15803d" font-size="11" class="mono">✓ PR #42 merged  (200 OK)</text>
    </g>
  </g>

  <!-- Press + Ledger card -->
  <g transform="translate(200,416)">
    <rect width="196" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
    <rect x="0" y="0" width="196" height="3" rx="2" fill="#f59e0b"/>
    <g transform="translate(14,14)">
      <text class="lbl" fill="#b45309">acri.press · Ledger</text>
      <text y="20" class="t1" font-size="12">Payload Compaction</text>
      <text y="36" class="t2">12 KB → 180 B</text>
      <text y="54" class="t2">OpenTelemetry span emitted</text>
    </g>
  </g>

  <!-- ═══ FOOTER RECEIPT ════════════════════════════════════ -->
  <g transform="translate(48,504)">
    <rect width="1004" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="20" cy="18" r="4" fill="#059669"/>
    <text x="36" y="23" fill="#64748b" font-size="11">
      <tspan fill="#0f172a" font-weight="700">Empirical Receipt (gemini-2.5-flash, 3 runs):</tspan>
      <tspan> Resolution </tspan><tspan fill="#2563eb" font-weight="700">0.038 ms</tspan>
      <tspan>  ·  Accuracy </tspan><tspan fill="#059669" font-weight="700">56% vs 20% naive</tspan>
      <tspan>  ·  Context cut </tspan><tspan fill="#7c3aed" font-weight="700">95%</tspan>
      <tspan>  ·  E2E latency </tspan><tspan font-weight="600">1.65 s (~equal)</tspan>
    </text>
  </g>
</svg>
