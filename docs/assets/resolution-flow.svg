<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="300" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="700" fill="#0f172a">acri — resolution flow</text>
  <text x="20" y="50" font-size="12" fill="#64748b">what actually runs on every call, today, in v0.1</text>

  <!-- Step 1: corpus -->
  <g>
    <rect x="20" y="90" width="170" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="105" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">corpus.index()</text>
    <text x="105" y="140" text-anchor="middle" font-size="11" fill="#334155">100 tools, indexed once</text>
    <text x="105" y="156" text-anchor="middle" font-size="11" fill="#334155">reused across the task</text>
  </g>
  <line x1="190" y1="135" x2="228" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: compass -->
  <g>
    <rect x="230" y="90" width="190" height="90" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="325" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">compass.resolve(query)</text>
    <text x="325" y="140" text-anchor="middle" font-size="11" fill="#334155">BM25, p50 0.038 ms</text>
    <text x="325" y="156" text-anchor="middle" font-size="11" fill="#334155">assay/latency.py</text>
  </g>
  <line x1="420" y1="135" x2="458" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: top k -->
  <g>
    <rect x="460" y="90" width="170" height="90" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="545" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">top 5 of 100</text>
    <text x="545" y="140" text-anchor="middle" font-size="11" fill="#334155">95% fewer tools shown</text><!-- assay/recall.py -->
    <text x="545" y="156" text-anchor="middle" font-size="11" fill="#334155">assay/recall.py</text>
  </g>
  <line x1="630" y1="135" x2="668" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: port -->
  <g>
    <rect x="670" y="90" width="170" height="90" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="755" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">port.gemini / .openai</text>
    <text x="755" y="140" text-anchor="middle" font-size="11" fill="#334155">one real provider call</text>
    <text x="755" y="156" text-anchor="middle" font-size="11" fill="#334155">no acri process in between</text>
  </g>
  <line x1="840" y1="135" x2="878" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5: result -->
  <g>
    <rect x="880" y="90" width="80" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="920" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">tool</text>
    <text x="920" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">calls</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="20" y="220" font-size="12" fill="#475569">What is not in this diagram, on purpose: no daemon, no proxy, no sandbox, no compaction step.</text>
  <text x="20" y="238" font-size="12" fill="#475569">None of those exist in the shipped code yet — see the roadmap in README.md before assuming otherwise.</text>
  <text x="20" y="270" font-size="11" fill="#94a3b8">Every number above is generated by the script named next to it — reproduce with `python -m assay.recall` / `python -m assay.latency`.</text>
</svg>
