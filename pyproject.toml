[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acri"
version = "0.3.0"
description = "A client-side capability resolver: pick the right few tools before the request is sent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Piyush Sharma" }]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6", "mcp>=1"]
# Only the assay/ scripts that need them, and only if you run those scripts —
# the acri package itself stays dependency-free. Same for yaml: only
# acri.config/acri.cli (acri.yaml, `acri init`/`check`) need it.
assay = ["openai>=1", "google-genai>=1", "mcp>=1"]
yaml = ["PyYAML>=6"]
# `acri up` -- connects to acri.yaml's mcp: entries. Bring your own provider
# SDK (openai and/or google-genai) matching whatever `models:` you configure.
server = ["PyYAML>=6", "mcp>=1"]
# `acri studio` -- decisions.md named this extra explicitly ("a separate
# optional install"). Same PyYAML need as yaml/server today; kept as its own
# name because decisions.md's boundary is "the core never imports it", and a
# reader typing `pip install acri[studio]` should get exactly that promise.
studio = ["PyYAML>=6"]
release = ["build>=1", "twine>=5"]

[project.scripts]
acri = "acri.cli:main"

[project.urls]
Homepage = "https://github.com/INERATE/acri"
Repository = "https://github.com/INERATE/acri"
Issues = "https://github.com/INERATE/acri/issues"

[tool.hatch.build.targets.wheel]
packages = ["acri"]
