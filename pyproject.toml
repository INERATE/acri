[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acri"
version = "0.1.0"
description = "A client-side capability resolver: pick the right few tools before the request is sent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Piyush Sharma" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6", "mcp>=1"]
# Only the assay/ scripts that need them, and only if you run those scripts —
# the acri package itself stays dependency-free. Same for yaml: only
# acri.config/acri.cli (acri.yaml, `acri init`/`check`) need it.
assay = ["openai>=1", "google-genai>=1", "mcp>=1"]
yaml = ["PyYAML>=6"]
# `acri up` -- connects to acri.yaml's mcp: entries. Bring your own provider
# SDK (openai and/or google-genai) matching whatever `models:` you configure.
server = ["PyYAML>=6", "mcp>=1"]

[project.scripts]
acri = "acri.cli:main"

[project.urls]
Homepage = "https://github.com/INERATE/acri"

[tool.hatch.build.targets.wheel]
packages = ["acri"]
